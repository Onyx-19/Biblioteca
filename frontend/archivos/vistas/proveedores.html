<div class="header">
    <h2>Gestión de Proveedores</h2>
    <input id="input_buscar" class="input_buscar" type="text" placeholder="Buscar proveedor">
    <button type="button" class="btn_annadir" onclick="abrirModalProveedor()">Añadir</button>
</div>


<div id="modalProveedor" class="modal-overlay" style="display: none;">
    <form id="formProveedor" class="form">
        <div class="form_header">
            <h3 class="form_header_h3">Creación de proveedor</h3>
            <button type="button" class="btn_close" onclick="cerrarModalProveedor()"><i class="bi bi-x"></i></button>
        </div>
        <div class="form_cont">
            <input id="idProveedor" class="campo_formulario" type="hidden">
            <div class="input_cont">
                <p>Identificación:</p>
                <input type="text" id="identificacionProveedor" class="campo_formulario" placeholder="N° de identificacion" required>
            </div>
            <div class="input_cont">
                <p>Nombre:</p>
                <input type="text" id="nombreProveedor" class="campo_formulario" placeholder="Nombre" required>
            </div>
            <div class="input_cont">
                <p>Correo:</p>
                <input type="text" id="correoProveedor" class="campo_formulario" placeholder="Correo" required>
            </div>
            <div class="input_cont">
                <p>Teléfono:</p>
                <input type="text" id="telefonoProveedor" class="campo_formulario" placeholder="Telefono">
            </div>
            <div class="input_cont">
                <p>Dirección:</p>
                <input type="text" id="direccionProveedor" class="campo_formulario" placeholder="Direccion">
            </div>

        </div>
        <div class="btn_guardar_cont">
            <button type="submit" class="btn_guardar">Guardar</button>
            <button type="button" class="btn_cancelar" onclick="cerrarModalProveedor()">Cancelar</button>
        </div>
        <button type="button" class="btn_eliminar" onclick="eliminarProveedor()">Eliminar</button>
    </form>
</div>

<div class="table_cont">
    <table id="tablaProveedores" class="list_table">
    </table>
</div>

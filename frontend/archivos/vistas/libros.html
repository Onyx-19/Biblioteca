<div class="header">
    <h2>Gestión de Libros</h2>
    <input id="input_buscar" class="input_buscar" type="text" placeholder="Buscar libro">
    <button type="button" class="btn_annadir" onclick="abrirModalLibro()">Añadir</button>
</div>


<div id="modalLibro" class="modal-overlay" style="display: none;">
    <form id="formLibro" class="form">
        <div class="form_header">
            <h3 class="form_header_h3">Creación de libro</h3>
            <button type="button" class="btn_close" onclick="cerrarModalLibro()"><i class="bi bi-x"></i></button>
        </div>
        <div class="form_cont">
            <input id="idLibro" class="campo_formulario" type="hidden">
            <div class="input_cont">
                <p>Título:</p>
                <input type="text" id="tituloLibro" class="campo_formulario" placeholder="Título del libro" required>
            </div>
            <div class="input_cont">
                <p>Editoral:</p>
                <input type="text" id="editorialLibro" class="campo_formulario" placeholder="Editorial">
            </div>
            <div class="input_cont">
                <p>ISBN 13:</p>
                <input type="text" id="usbnLibro" class="campo_formulario" placeholder="ISBN">
            </div>
            <div class="input_cont">
                <p>Año de publicación:</p>
                <input type="number" id="annoPublicacion" class="campo_formulario" placeholder="Año de publicación">
            </div>
            <div class="input_cont">
                <p>Valor del libro:</p>
                <input type="number" id="valorLibro" class="campo_formulario" placeholder="Valor del libro" required>
            </div>
            <div class="input_cont">
                <p>Nombre del autor:</p>
                <select id="autorLibro" class="campo_formulario" required></select>
            </div>
            <div class="input_cont">
                <p>Categoria del libro:</p>
                <select id="categoriaLibro" class="campo_formulario" required></select>
            </div>



        </div>
        <div class="btn_guardar_cont">
            <button type="submit" class="btn_guardar">Guardar</button>
            <button type="button" class="btn_cancelar" onclick="cerrarModalLibro()">Cancelar</button>
        </div>
        <button type="button" class="btn_eliminar" onclick="eliminarLibro()">Eliminar</button>
    </form>
</div>

<div class="table_cont">
    <table id="tablaLibros" class="list_table">
    </table>
</div>

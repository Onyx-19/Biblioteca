<div class="header">
    <h2>Gestión de Prestamos</h2>
    <button type="button" class="btn_annadir" onclick="abrirModalPrestamo()">Añadir</button>
</div>


<div id="modalPrestamo" class="modal-overlay" style="display: none;">
    <form id="formPrestamo" class="form form_v2">
        <div class="form_header">
            <h3 class="form_header_h3">Registrar prestamo</h3>
            <button type="button" class="btn_close" onclick="cerrarModalPrestamo()">
                <i class="bi bi-x"></i>
            </button>
        </div>
        <div class="form_cont">
            <table class="list_table v2" id="tableSelectPrestamo">
            </table>

            <table class="list_table v2" id="tableDocumento">
            </table>

            <table class="list_table v2" id="registroPrestamo">
                <tr class="input_cont">
                    <th class="col_lm">Libro</th>
                    <th class="col_xs">Unidades</th>
                    <th class="col_xs">Añadir</th>
                    <th class="col_xs">Borrar</th>
                </tr>
            </table>
        </div>

        <div class="btn_guardar_cont">
            <button type="submit" class="btn_guardar">Guardar</button>
            <button type="button" class="btn_cancelar" onclick="cerrarModalPrestamo()">Cancelar</button>
        </div>
    </form>
</div>

<div>
    <h2 style="margin:1% 2%">Consultas</h2>
    <div class="btn_consulta_cont">
        <button class="btn_consulta" onclick="prestamoHistorico()">Historico</button>
        <!-- <button class="btn_consulta" onclick="prestamoHistorico()">Activos</button>
        <button class="btn_consulta" onclick="prestamoHistorico()">Finalizados</button>
        <button class="btn_consulta" onclick="prestamoHistorico()">Vencidos</button> -->
    </div>

    <div id="cont_table" class="table_cont">
    </div>


    <div id="modalDetalle" class="modal-overlay" style="display:none;">
        <div class="form">
            <div class="form_header">
                <h2>Detalle del documento N° <span id="detalleDocumento"></span></h2>
                <button type="button" class="btn_close" onclick="cerrarModalPrestamosDetalle()">
                    <i class="bi bi-x"></i>
                </button>
            </div>

            <div class="form_cont">

                <table class="list_table v2">
                    <thead>
                        <tr>
                            <th class="col_lm">Libro</th>
                            <th class="col_xs">Unidades</th>
                        </tr>
                    </thead>
                    <tbody id="detalleItems"></tbody>
                </table>
            </div>
            <div class="btn_guardar_cont">
                <button type="button" class="btn_cancelar" onclick="cerrarModalPrestamosDetalle()">Cerrar</button>
            </div>
            </div>
    </div>

</div>

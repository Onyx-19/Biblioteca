<div class="header">
    <h2>Gestión de Inventarios</h2>
    <button type="button" class="btn_annadir" onclick="abrirModalInventario()">Añadir</button>
</div>


<div id="modalInventario" class="modal-overlay" style="display: none;">
    <form id="formInventario" class="form form_v2">
        <div class="form_header">
            <h3 class="form_header_h3">Registro de movimiento de inventario</h3>
            <button type="button" class="btn_close" onclick="cerrarModalInventario()"><i class="bi bi-x"></i></button>
        </div>
        <div class="form_cont">
            <table class="list_table v2" id="tableSelect">
            </table>

            <table class="list_table v2" id="tableDocumento">
            </table>

            <table class="list_table v2" id="registroInventario">
                <tr class="input_cont">
                    <th class="col_lm">Libro</th>
                    <th class="col_xs">Unidades</th>
                    <th class="col_xs">Añadir</th>
                    <th class="col_xs">Borrar</th>
                </tr>
            </table>
        </div>

        <div class="btn_guardar_cont">
            <button type="submit" class="btn_guardar">Guardar</button>
            <button type="button" class="btn_cancelar" onclick="cerrarModalInventario()">Cancelar</button>
        </div>
    </form>
</div>

<div>
    <h2 style="margin:1% 2%">Consultas</h2>
    <div class="btn_consulta_cont">
        <button class="btn_consulta">Entradas</button>
        <button class="btn_consulta">Salidas</button>
        <button class="btn_consulta">Traslados</button>
        <button class="btn_consulta" onclick="inventarioHistorico()">Historico</button>
        <button class="btn_consulta" onclick="consultaStock()">Stock</button>
    </div>

    <div id="cont_table" class="table_cont">
    </div>


    <div id="modalDetalle" class="modal-overlay" style="display:none;">
        <div class="form">
            <div class="form_header">
                <h2>Detalle del documento N° <span id="detalleDocumento"></span></h2>
                <button type="button" class="btn_close" onclick="cerrarModalInventarioDetalle()">
                    <i class="bi bi-x"></i>
                </button>
            </div>

            <div class="form_cont">

                <table class="list_table v2">
                    <thead>
                        <tr>
                            <th class="col_lm">Libro</th>
                            <th class="col_xs">Unidades</th>
                        </tr>
                    </thead>
                    <tbody id="detalleItems"></tbody>
                </table>
            </div>
            <div class="btn_guardar_cont">
                <button type="button" class="btn_cancelar" onclick="cerrarModalInventarioDetalle()">Cerrar</button>
            </div>
            </div>
    </div>

</div>

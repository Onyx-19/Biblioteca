<div class="header">
    <h2>Gestión de Clientes</h2>
    <input id="input_buscar" class="input_buscar" type="text" placeholder="Buscar cliente">
    <button type="button" class="btn_annadir" onclick="abrirModalCliente()">Añadir</button>
</div>


<div id="modalCliente" class="modal-overlay" style="display: none;">
    <form id="formCliente" class="form">
        <div class="form_header">
            <h3 class="form_header_h3">Creación de cliente</h3>
            <button type="button" class="btn_close" onclick="cerrarModalCliente()"><i class="bi bi-x"></i></button>
        </div>
        <div class="form_cont">
            <input id="idCliente" class="campo_formulario" type="hidden">
            <div class="input_cont">
                <p>Identificación:</p>
                <input type="text" id="identificacionCliente" class="campo_formulario" placeholder="N° de identificacion" required>
            </div>
            <div class="input_cont">
                <p>Nombre:</p>
                <input type="text" id="nombreCliente" class="campo_formulario" placeholder="Nombre" required>
            </div>
            <div class="input_cont">
                <p>Correo:</p>
                <input type="text" id="correoCliente" class="campo_formulario" placeholder="Correo" required>
            </div>
            <div class="input_cont">
                <p>Teléfono:</p>
                <input type="text" id="telefonoCliente" class="campo_formulario" placeholder="Telefono" required>
            </div>
            <div class="input_cont">
                <p>Dirección:</p>
                <input type="text" id="direccionCliente" class="campo_formulario" placeholder="Direccion">
            </div>

        </div>
        <div class="btn_guardar_cont">
            <button type="submit" class="btn_guardar">Guardar</button>
            <button type="button" class="btn_cancelar" onclick="cerrarModalCliente()">Cancelar</button>
        </div>
        <button type="button" class="btn_eliminar" onclick="eliminarCliente()">Eliminar</button>
    </form>
</div>

<div class="table_cont">
    <table id="tablaClientes" class="list_table">
    </table>
</div>

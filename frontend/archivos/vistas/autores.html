<div class="header">
    <h2>Gestión de Autores</h2>
    <input id="input_buscar" class="input_buscar" type="text" placeholder="Buscar Autores">
    <button type="button" class="btn_annadir" onclick="abrirModalAutor()">Añadir</button>
</div>


<div id="modalAutor" class="modal-overlay" style="display: none;">
    <form id="formAutor" class="form">
        <div class="form_header">
            <h3 class="form_header_h3">Creación de autores</h3>
            <button type="button" class="btn_close" onclick="cerrarModalAutor()"><i class="bi bi-x"></i></button>
        </div>
        <div class="form_cont">
            <input id="idAutor" class="campo_formulario" type="hidden">
            <div class="input_cont">
                <p>Nombre:</p>
                <input type="text" id="nombreAutor" class="campo_formulario" placeholder="Nombre" required>
            </div>
            <div class="input_cont">
                <p>Año de nacimiento:</p>
                <input type="text" id="annoNacimiento" class="campo_formulario" placeholder="Año de nacimiento">
            </div>
            <div class="input_cont">
                <p>Año de fallecimiento:</p>
                <input type="text" id="annoDeceso" class="campo_formulario" placeholder="Año de fallecimiento">
            </div>
        </div>
        <div class="btn_guardar_cont">
            <button type="submit" class="btn_guardar">Guardar</button>
            <button type="button" class="btn_cancelar" onclick="cerrarModalAutor()">Cancelar</button>
        </div>
        <button type="button" class="btn_eliminar" onclick="eliminarAutor()">Eliminar</button>
    </form>
</div>

<div class="table_cont">
    <table id="tablaAutores" class="list_table">
    </table>
</div>

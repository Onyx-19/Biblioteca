<div class="header">
    <h2>Gestión de Usuarios</h2>
    <input id="input_buscar" class="input_buscar" type="text" placeholder="Buscar usuario por nombre">
    <button type="button" class="btn_annadir" onclick="abrirModalUsuario()">Añadir</button>
</div>


<div id="modal" class="modal-overlay" style="display: none;">
    <form id="formUsuario" class="form">
        <div class="form_header">
            <h3 class="form_header_h3">Creación de usuario</h3>
            <button type="button" class="btn_close" onclick="cerrarModalUsuario()"><i class="bi bi-x"></i></button>
        </div>
        <div class="form_cont">
            <input id="idUsuario" class="campo_formulario" type="hidden">
            <div class="input_cont">
                <p>Numero de identificacion:</p>
                <input type="text" id="identificacionUsuario" class="campo_formulario" placeholder="N° identificacion" required>
            </div>
            <div class="input_cont">
                <p>Nombre:</p>
                <input type="text" id="nombreUsuario" class="campo_formulario" placeholder="Nombre" required>
            </div>
            <div class="input_cont">
                <p>Correo:</p>
                <input type="email" id="correoUsuario" class="campo_formulario" placeholder="Correo" required>
            </div>
            <div class="input_cont">
                <p>Dirección:</p>
                <input type="text" id="direccionUsuario" class="campo_formulario" placeholder="Direccion">
            </div>
            <div class="input_cont">
                <p>Teléfono:</p>
                <input type="text" id="telefonoUsuario" class="campo_formulario" placeholder="Telefono" >
            </div>
            <div class="input_cont">
                <p>Rol de usuario:</p>
                <select type="text" id="rolUsuario" class="campo_formulario" placeholder="Rol" required> </select>
            </div>
            <div class="input_cont">
                <p>Sucursal:</p>
                <select id="sucursalUsuario" class="campo_formulario" required></select>
            </div>


        </div>
        <div class="btn_guardar_cont">
            <button type="submit" class="btn_guardar">Guardar</button>
            <button type="button" class="btn_cancelar" onclick="cerrarModalUsuario()">Cancelar</button>
        </div>
        <button type="button" class="btn_eliminar" onclick="eliminarUsuario()">Eliminar</button>
    </form>
</div>

<div class="table_cont">
    <table id="tablaUsuarios" class="list_table">
    </table>
</div>

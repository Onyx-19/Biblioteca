<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="archivos/css/index.css">
    <title>Document</title>
</head>
<body>
    <nav class="nav" >
        <div class="logo_cont">
            <img class="logo" src="archivos/img/LogoTexto.png" alt="">
        </div>
        <div class="sucursal_cont">
            <p class="sucrusal_encabezado">SUCURSAL</p>
            <div class="sucursal_mini_cont">
                <i class="bi bi-building-check"></i>
                <select>
                    <option value="">Sucursal centro</option>
                </select>
            </div>
        </div>
        <div class="modulos_cont"> 
            <p class="modulo_encabezado">MODULOS</p>
            <ul class="modulos_list">
                <li class="modulo"><i class="bi bi-search"></i>Consultas</li>
                <li class="modulo"><i class="bi bi-arrow-left-right"></i>Prestamos</li>
                <li class="modulo"><i class="bi bi-person-check"></i>Clientes</li>
                <li class="modulo"><i class="bi bi-box-seam"></i>Inventarios</li>
                <li class="modulo"><i class="bi bi-truck"></i>Proveedores</li>
                <li class="modulo"><i class="bi bi-book"></i>Libros</li>
                <li class="modulo"><i class="bi bi-pen"></i>Autores</li>
                <li class="modulo"><i class="bi bi-tags"></i>Categorias</li>
                <li class="modulo"><i class="bi bi-person-circle"></i>Usuarios</li>
                <li class="modulo"><i class="bi bi-building-gear"></i>Sucursales</li>
            </ul>
        </div>
        <div class="perfil_cont">
            <div class="perfil_mini_cont">
                <i class="bi bi-person-gear"></i>
                <div class="perfil">
                    <p>Nombre.apellido</p>
                    <p class="perfil_rol">Administrador</p>
                </div>
            </div>
            <button class="btn_cerrar_sesion">Cerrar sesion</button>
        </div>
    </nav>
</body>
</html>

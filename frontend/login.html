<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="archivos/css/index.css">
    <title>Auth</title>
</head>
<body>
    <div class="cont_login">
        <form class="form_login" action="">
            <div class="input_cont_login">
                <h2>Bienvenido de nuevo</h2>
            </div>
            <p class="text">Ingresa tus credenciales para acceder a Bibliored.</p>
            <div class="input_cont_login">
                <p class="text">Usuario</p>
                <input class="input_login" id="user" type="text" placeholder="N° identificacion">
            </div>
            <div class="input_cont_login">
                <p class="text">Contraseña</p>
                <input class="input_login" id="password" type="password" placeholder="Contraseña">
            </div>
            <a href="#" class="reset_pass" id="reset_pass" onclick="resetPass()">¿Olvidaste tu contraseña?</a>
            <div class="input_cont_login">
                <button class="btn_login" id="btn_login" type="button">Ingresar</button>
            </div>
        </form>
    </div>

    <div id="modalReset" class="modal-overlay">
        <form id="formReset" class="form">
            <div class="form_header">
                <h3 class="form_header_h3">Cambio de contraseña</h3>
            </div>
            <div class="form_cont">
                <div class="input_cont">
                    <p>Usuario:</p>
                    <input type="text" id="userReset" class="campo_formulario" placeholder="Usuario" required>
                </div>
                <div class="input_cont">
                    <p>Correo:</p>
                    <input type="email" id="mailReset" class="campo_formulario" placeholder="Correo" required>
                </div>
            </div>
            <div class="btn_guardar_cont">
                <button type="submit" class="btn_guardar">Guardar</button>
            </div>
        </form>
    </div>
    <script src="archivos/js/config.js"></script>
    <script src="archivos/js/password.js"></script>
    <script src="archivos/js/login.js"></script>
</body>
</html>
